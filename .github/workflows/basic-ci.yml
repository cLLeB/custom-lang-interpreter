name: Basic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Check formatting
      run: cargo fmt --all -- --check
      
    - name: Lint with clippy
      run: cargo clippy --all-targets -- -D warnings
      
    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose
      
    - name: Build release
      run: cargo build --release
      
    - name: Test examples
      run: |
        echo "Testing core examples..."
        cargo run --release -- examples/test.cl
        cargo run --release -- examples/calculator.cl
        cargo run --release -- examples/arrays_demo.cl
        cargo run --release -- examples/string_demo.cl
        cargo run --release -- examples/file_io_demo.cl
        cargo run --release -- examples/objects_simple_demo.cl
        echo "Testing advanced features (with --no-semantic)..."
        cargo run --release -- --no-semantic examples/classes_demo.cl
        cargo run --release -- --no-semantic examples/pattern_matching_demo.cl
        cargo run --release -- --no-semantic examples/modules_demo.cl
        echo "All examples passed!"
        
    - name: Run performance test
      run: cargo run --release -- examples/performance_test.cl
