name: Comprehensive CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Quality checks and testing
  quality:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-
          ${{ runner.os }}-cargo-

    - name: Check code formatting
      run: cargo fmt --all -- --check

    - name: Run clippy lints
      run: cargo clippy --all-targets -- -D warnings

    - name: Build project (debug)
      run: cargo build --verbose

    - name: Run unit tests
      run: cargo test --verbose

    - name: Build project (release)
      run: cargo build --release --verbose

    - name: Test example programs
      run: |
        echo "🧪 Testing example programs..."
        echo "Testing basic example..."
        timeout 30s cargo run --release -- examples/test.cl
        echo "Testing calculator example..."
        timeout 30s cargo run --release -- examples/calculator.cl
        echo "Testing arrays demo..."
        timeout 30s cargo run --release -- examples/arrays_demo.cl
        echo "Testing math playground (simple)..."
        timeout 30s cargo run --release -- examples/math_playground_simple.cl
        echo "Testing number game..."
        timeout 30s cargo run --release -- examples/number_game.cl
        echo "✅ All examples passed!"

    - name: Run integration tests
      run: cargo test --test integration_tests --verbose

    - name: Generate test summary
      if: always()
      run: |
        echo "## 🧪 Test Results for Rust ${{ matrix.rust }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code formatting: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Clippy lints: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Unit tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Integration tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Example programs: Passed" >> $GITHUB_STEP_SUMMARY

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail CI if audit finds issues
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-audit-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-audit
      run: cargo install --locked cargo-audit

    - name: Run security audit
      run: cargo audit --ignore RUSTSEC-0000-0000 || echo "Security audit completed with warnings"

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate code coverage
      run: cargo llvm-cov --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # Performance testing
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-perf-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release
      run: cargo build --release

    - name: Run performance tests
      run: |
        echo "🚀 Running performance benchmarks..."
        echo "Testing performance with large program..."
        time timeout 30s cargo run --release -- examples/performance_test.cl || echo "Performance test completed"
        echo "✅ Performance tests completed!"

  # Cross-platform compatibility
  cross-platform:
    name: Cross-Platform Build
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}

    - name: Build for target
      run: cargo build --release --target ${{ matrix.target }}

    - name: Run tests
      run: cargo test --target ${{ matrix.target }}

    - name: Test basic example (Unix)
      if: runner.os != 'Windows'
      run: cargo run --release --target ${{ matrix.target }} -- examples/test.cl

    - name: Test basic example (Windows)
      if: runner.os == 'Windows'
      run: cargo run --release --target ${{ matrix.target }} -- examples/test.cl

  # Documentation and linting
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}

    - name: Generate documentation
      run: cargo doc --no-deps --document-private-items

    - name: Check for broken links in docs
      run: cargo doc --no-deps 2>&1 | grep -i "warning\|error" || echo "Documentation generated successfully"

  # Release automation
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [quality, security, cross-platform, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Build release binary
      run: cargo build --release

    - name: Create release archive
      run: |
        mkdir -p release
        cp target/release/custom-lang release/
        cp README.md CHANGELOG.md LICENSE release/
        cp -r examples release/
        tar -czf custom-lang-interpreter-${{ github.ref_name }}.tar.gz -C release .

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: custom-lang-interpreter-${{ github.ref_name }}.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Final status check
  ci-success:
    name: CI Pipeline Status
    runs-on: ubuntu-latest
    needs: [quality, security, coverage, performance, cross-platform, docs]
    if: always()

    steps:
    - name: Check all jobs status
      run: |
        echo "## 🎯 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Quality & Testing | ${{ needs.quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Audit | ${{ needs.security.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Coverage | ${{ needs.coverage.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance | ${{ needs.performance.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Cross-Platform | ${{ needs.cross-platform.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Documentation | ${{ needs.docs.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check if critical jobs passed
        if [[ "${{ needs.quality.result }}" == "success" && "${{ needs.cross-platform.result }}" == "success" ]]; then
          echo "🎉 **CI Pipeline: SUCCESS** - All critical checks passed!" >> $GITHUB_STEP_SUMMARY
          exit 0
        else
          echo "💥 **CI Pipeline: FAILED** - Critical checks failed!" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  # Repository maintenance
  repo-maintenance:
    name: Repository Maintenance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update repository topics
      run: |
        # Add discoverable topics to the repository
        curl -X PUT \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.mercy-preview+json" \
          "https://api.github.com/repos/${{ github.repository }}/topics" \
          -d '{
            "names": [
              "rust",
              "interpreter",
              "programming-language",
              "repl",
              "compiler",
              "lexer",
              "parser",
              "ast",
              "custom-language",
              "rust-lang",
              "cli-tool",
              "educational",
              "language-design",
              "syntax-analysis",
              "semantic-analysis"
            ]
          }' || echo "Failed to update topics (may not have permissions)"
