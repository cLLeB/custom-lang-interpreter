name: Comprehensive CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Quality checks and testing
  quality:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.rust }}-
          ${{ runner.os }}-cargo-

    - name: Check code formatting
      run: cargo fmt --all -- --check

    - name: Run clippy lints
      run: cargo clippy --all-targets -- -D warnings

    - name: Check for compilation warnings
      run: |
        echo "Checking for compilation warnings..."
        cargo build --release 2>&1 | tee build.log
        if grep -i "warning" build.log; then
          echo "⚠️ Compilation warnings found - please review"
          exit 0  # Don't fail CI for warnings, just notify
        else
          echo "✅ No compilation warnings found"
        fi

    - name: Validate example files
      run: |
        echo "🔍 Validating example files..."

        # Check that all required example files exist
        required_examples=(
          "examples/test.cl"
          "examples/calculator.cl"
          "examples/arrays_demo.cl"
          "examples/enhanced_arrays_demo.cl"
          "examples/string_demo.cl"
          "examples/file_io_demo.cl"
          "examples/objects_demo.cl"
          "examples/objects_simple_demo.cl"
          "examples/classes_demo.cl"
          "examples/pattern_matching_demo.cl"
          "examples/modules_demo.cl"
          "examples/math_utils.cl"
          "examples/error_handling_demo.cl"
          "examples/math_playground_simple.cl"
          "examples/number_game.cl"
          "examples/performance_test.cl"
        )

        missing_files=()
        for file in "${required_examples[@]}"; do
          if [[ ! -f "$file" ]]; then
            missing_files+=("$file")
          fi
        done

        if [[ ${#missing_files[@]} -gt 0 ]]; then
          echo "❌ Missing example files:"
          printf '%s\n' "${missing_files[@]}"
          exit 1
        else
          echo "✅ All required example files found"
        fi

    - name: Build project (debug)
      run: cargo build --verbose

    - name: Run unit tests
      run: cargo test --verbose

    - name: Build project (release)
      run: cargo build --release --verbose

    - name: Test example programs
      run: |
        echo "🧪 Testing example programs..."
        echo "Testing basic example..."
        timeout 30s cargo run --release -- examples/test.cl
        echo "Testing calculator example..."
        timeout 30s cargo run --release -- examples/calculator.cl
        echo "Testing arrays demo..."
        timeout 30s cargo run --release -- examples/arrays_demo.cl
        echo "Testing enhanced arrays demo..."
        timeout 30s cargo run --release -- examples/enhanced_arrays_demo.cl
        echo "Testing string manipulation demo..."
        timeout 30s cargo run --release -- examples/string_demo.cl
        echo "Testing file I/O demo..."
        timeout 30s cargo run --release -- examples/file_io_demo.cl
        echo "Testing objects demo..."
        timeout 30s cargo run --release -- examples/objects_demo.cl
        echo "Testing objects simple demo..."
        timeout 30s cargo run --release -- examples/objects_simple_demo.cl
        echo "Testing classes demo..."
        timeout 30s cargo run --release -- --no-semantic examples/classes_demo.cl
        echo "Testing pattern matching demo..."
        timeout 30s cargo run --release -- --no-semantic examples/pattern_matching_demo.cl
        echo "Testing modules demo..."
        timeout 30s cargo run --release -- --no-semantic examples/modules_demo.cl
        echo "Testing error handling demo..."
        timeout 30s cargo run --release -- examples/error_handling_demo.cl
        echo "Testing math playground (simple)..."
        timeout 30s cargo run --release -- examples/math_playground_simple.cl
        echo "Testing number game..."
        timeout 30s cargo run --release -- examples/number_game.cl
        echo "✅ All examples passed!"

    - name: Run integration tests
      run: cargo test --test integration_tests --verbose

    - name: Run comprehensive feature tests
      run: |
        echo "🚀 Running comprehensive feature test suite..."
        chmod +x test_all_features.sh
        ./test_all_features.sh

    - name: Generate test summary
      if: always()
      run: |
        echo "## 🧪 Test Results for Rust ${{ matrix.rust }}" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code formatting: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Clippy lints: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Unit tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Integration tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Example programs: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Comprehensive feature tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Features Tested:" >> $GITHUB_STEP_SUMMARY
        echo "- Core language features (variables, functions, control flow)" >> $GITHUB_STEP_SUMMARY
        echo "- Data structures (arrays, objects, strings)" >> $GITHUB_STEP_SUMMARY
        echo "- Advanced features (classes, pattern matching, modules)" >> $GITHUB_STEP_SUMMARY
        echo "- File I/O operations and error handling" >> $GITHUB_STEP_SUMMARY
        echo "- REPL and interactive development" >> $GITHUB_STEP_SUMMARY

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail CI if audit finds issues
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-audit-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-audit
      run: cargo install --locked cargo-audit

    - name: Run security audit
      run: cargo audit --ignore RUSTSEC-0000-0000 || echo "Security audit completed with warnings"

    - name: Check for sensitive information
      run: |
        echo "🔒 Checking for sensitive information..."

        # Check for common sensitive patterns
        sensitive_patterns=(
          "password"
          "secret"
          "api_key"
          "private_key"
          "token"
        )

        found_sensitive=false
        for pattern in "${sensitive_patterns[@]}"; do
          if grep -ri "$pattern" src/ examples/ --exclude-dir=target || true; then
            echo "⚠️ Found potential sensitive information: $pattern"
            found_sensitive=true
          fi
        done

        if [[ "$found_sensitive" == "true" ]]; then
          echo "⚠️ Please review potential sensitive information above"
          echo "This is a warning, not a failure"
        else
          echo "✅ No sensitive information patterns found"
        fi

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate code coverage
      run: cargo llvm-cov --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  # Performance testing
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-perf-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release
      run: cargo build --release

    - name: Run performance tests
      run: |
        echo "🚀 Running performance benchmarks..."
        echo "Testing performance with large program..."
        time timeout 30s cargo run --release -- examples/performance_test.cl || echo "Performance test completed"
        echo "✅ Performance tests completed!"

  # Cross-platform compatibility
  cross-platform:
    name: Cross-Platform Build
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cross-${{ hashFiles('**/Cargo.lock') }}

    - name: Build for target
      run: cargo build --release --target ${{ matrix.target }}

    - name: Run tests
      run: cargo test --target ${{ matrix.target }}

    - name: Test basic example (Unix)
      if: runner.os != 'Windows'
      run: cargo run --release --target ${{ matrix.target }} -- examples/test.cl

    - name: Test basic example (Windows)
      if: runner.os == 'Windows'
      run: cargo run --release --target ${{ matrix.target }} -- examples/test.cl

  # Documentation and linting
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-docs-${{ hashFiles('**/Cargo.lock') }}

    - name: Generate documentation
      run: cargo doc --no-deps --document-private-items

    - name: Check for broken links in docs
      run: cargo doc --no-deps 2>&1 | grep -i "warning\|error" || echo "Documentation generated successfully"

  # Release automation
  build-release:
    name: Build Release Binaries (${{ matrix.name }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, security, cross-platform, docs]
    strategy:
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: custom-lang-linux-x86_64
            binary: custom-lang
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: custom-lang-windows-x86_64.exe
            binary: custom-lang.exe
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: custom-lang-macos-x86_64
            binary: custom-lang
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: custom-lang-macos-arm64
            binary: custom-lang
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Rename binary (Unix)
      if: runner.os != 'Windows'
      run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

    - name: Rename binary (Windows)
      if: runner.os == 'Windows'
      run: copy target\${{ matrix.target }}\release\${{ matrix.binary }} ${{ matrix.artifact }}

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact }}
        retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all binaries
      uses: actions/download-artifact@v4
      with:
        path: dist/

    - name: Create source archive
      run: |
        mkdir -p release-assets
        cp -r dist/*/* release-assets/ 2>/dev/null || true
        cp README.md CHANGELOG.md LICENSE release-assets/
        tar -czf custom-lang-${{ github.ref_name }}-examples.tar.gz examples/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-assets/custom-lang-linux-x86_64
          release-assets/custom-lang-windows-x86_64.exe
          release-assets/custom-lang-macos-x86_64
          release-assets/custom-lang-macos-arm64
          custom-lang-${{ github.ref_name }}-examples.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
        body: |
          ## Custom Language Interpreter ${{ github.ref_name }}

          ### Download the right binary for your platform:

          | Platform | File |
          |----------|------|
          | Linux x86_64 | `custom-lang-linux-x86_64` |
          | Windows x86_64 | `custom-lang-windows-x86_64.exe` |
          | macOS x86_64 (Intel) | `custom-lang-macos-x86_64` |
          | macOS arm64 (Apple Silicon) | `custom-lang-macos-arm64` |

          ### Quick start
          ```bash
          # Make executable (Linux/macOS)
          chmod +x custom-lang-*

          # Run a file
          ./custom-lang-linux-x86_64 program.cl

          # Start the REPL
          ./custom-lang-linux-x86_64 --repl
          ```

          See [CHANGELOG.md](CHANGELOG.md) for what's new.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Final status check
  ci-success:
    name: CI Pipeline Status
    runs-on: ubuntu-latest
    needs: [quality, security, coverage, performance, cross-platform, docs]
    if: always()

    steps:
    - name: Check all jobs status
      run: |
        echo "## 🎯 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Quality & Testing | ${{ needs.quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Audit | ${{ needs.security.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Coverage | ${{ needs.coverage.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance | ${{ needs.performance.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Cross-Platform | ${{ needs.cross-platform.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Documentation | ${{ needs.docs.result == 'success' && '✅ Passed' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check if critical jobs passed
        if [[ "${{ needs.quality.result }}" == "success" && "${{ needs.cross-platform.result }}" == "success" ]]; then
          echo "🎉 **CI Pipeline: SUCCESS** - All critical checks passed!" >> $GITHUB_STEP_SUMMARY
          exit 0
        else
          echo "💥 **CI Pipeline: FAILED** - Critical checks failed!" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  # Repository maintenance
  repo-maintenance:
    name: Repository Maintenance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update repository topics
      run: |
        # Add discoverable topics to the repository
        curl -X PUT \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.mercy-preview+json" \
          "https://api.github.com/repos/${{ github.repository }}/topics" \
          -d '{
            "names": [
              "rust",
              "interpreter",
              "programming-language",
              "repl",
              "compiler",
              "lexer",
              "parser",
              "ast",
              "custom-language",
              "rust-lang",
              "cli-tool",
              "educational",
              "language-design",
              "syntax-analysis",
              "semantic-analysis",
              "pattern-matching",
              "object-oriented",
              "classes",
              "inheritance",
              "modules",
              "file-io",
              "string-manipulation",
              "arrays",
              "objects",
              "error-handling",
              "functional-programming"
            ]
          }' || echo "Failed to update topics (may not have permissions)"
