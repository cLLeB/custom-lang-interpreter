[package]
name = "custom-lang"
version = "0.2.0"
edition = "2021"
authors = ["Caleb Kyere Boateng <kyereboatengcaleb@gmail.com>"]
description = "A modern programming language interpreter with comprehensive features including dynamic typing, control flow, functions, and interactive REPL"
license = "MIT"
repository = "https://github.com/cLLeB/custom-lang-interpreter"
homepage = "https://github.com/cLLeB/custom-lang-interpreter"
documentation = "https://github.com/cLLeB/custom-lang-interpreter/blob/main/README.md"
keywords = ["interpreter", "programming-language", "rust", "repl", "compiler"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]
readme = "README.md"
rust-version = "1.70"

[lib]
name = "custom_lang"
path = "src/lib.rs"

[[bin]]
name = "custom-lang"
path = "src/main.rs"

[dependencies]
# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI and REPL
clap = { version = "4.0", features = ["derive"] }
rustyline = "13.0"

# Utilities
colored = "2.0"

# HTTP client (blocking)
ureq = "2.9"

# Regex
regex = "1.10"

# Date/time
chrono = "0.4"

[dev-dependencies]
# Testing utilities
assert_matches = "1.5"

# Performance optimizations for release builds
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Development profile with faster compilation
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

# Test profile
[profile.test]
opt-level = 1
debug = true

# Benchmark profile
[profile.bench]
opt-level = 3
debug = false
lto = true
